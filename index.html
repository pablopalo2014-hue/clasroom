<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Ayuda de Google Classroom</title>
  <link rel="icon" type="image/png" href="classroom.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', Roboto, Arial, sans-serif; }
    body { background-color: #ffffff; color: #202124; overflow-x: hidden; user-select: none; }

    /* --- Vista Google Classroom --- */
    #classroom-view { display: block; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid #dadce0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-container img { width: 32px; height: 32px; }
    .logo-container h1 { font-size: 20px; color: #5f6368; font-weight: 400; }
    .main-container { max-width: 850px; margin: 40px auto; padding: 0 24px; }
    .classroom-article h2 { font-size: 32px; color: #1a73e8; font-weight: 400; margin-bottom: 24px; line-height: 1.2; }
    .classroom-article p { font-size: 16px; line-height: 1.6; color: #3c4043; margin-bottom: 20px; }
    .classroom-article ul { margin: 0 0 24px 28px; }
    .classroom-article li { font-size: 16px; line-height: 1.8; color: #3c4043; }
    .note-box { background-color: #e8f0fe; border-left: 4px solid #1a73e8; border-radius: 0 8px 8px 0; padding: 18px 20px; margin-top: 24px; }
    .note-box p { margin-bottom: 0; color: #174ea6; font-size: 15px; }

    /* --- Vista Geometry Dash --- */
    #gd-view { display: none; width: 100vw; height: 100vh; background: #07090e; flex-direction: column; align-items: center; justify-content: center; }
    #gd-nav { display: flex; gap: 10px; margin-bottom: 10px; }
    .nav-btn { background: #21262d; border: 1px solid #30363d; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .nav-btn.active { background: #1f6feb; border-color: #58a6ff; }
    #gd-header { color: #fff; font-size: 15px; margin-bottom: 10px; display: flex; gap: 20px; font-weight: bold; text-transform: uppercase; }
    .hud-badge { padding: 4px 10px; border-radius: 4px; font-size: 12px; color: #fff; background: #222; }
    canvas { background: #0d1117; border: 2px solid #30363d; border-radius: 6px; cursor: crosshair; }
