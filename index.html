<!DOCTYPE html>
<html lang="es">
<head>

  <title>Centro de Ayuda de Google Classroom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* --- Tipografía por defecto de Google (Roboto) --- */
    body, html, p, li, h1, h2, h3, div, span, button, a {
      font-family: 'Roboto', Arial, sans-serif !important;
    }

    body, html { width: 100%; height: 100%; overflow-x: hidden; background-color: #ffffff; color: #202124; user-select: none; }

    #classroom-view { display: block; width: 100%; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid #dadce0; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-container img { width: 32px; height: 32px; object-fit: contain; }
    .logo-container h1 { font-size: 20px; color: #5f6368; font-weight: 400; }
    .main-container { max-width: 850px; margin: 30px auto; padding: 0 24px; }
    
    .classroom-article h2 { font-size: 24px; color: #1a73e8; font-weight: 400; margin: 24px 0 16px 0; line-height: 1.2; }
    .classroom-article h3 { font-size: 18px; color: #202124; font-weight: 500; margin: 20px 0 12px 0; }
    .classroom-article p { font-size: 14px; line-height: 1.6; color: #3c4043; margin-bottom: 16px; }
    .classroom-article ul, .classroom-article ol { margin: 0 0 20px 28px; }
    .classroom-article li { font-size: 14px; line-height: 1.8; color: #3c4043; }
    
    .note-box { background-color: #e8f0fe; border-left: 4px solid #1a73e8; border-radius: 0 8px 8px 0; padding: 16px 20px; margin: 20px 0; }
    .note-box p { margin-bottom: 0; color: #174ea6; font-size: 14px; }

    /* --- Vista Geometry Dash --- */
    #gd-view { display: none; width: 100vw; height: 100vh; background: #07090e; flex-direction: column; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; z-index: 9999; }
    #gd-nav { display: flex; gap: 10px; margin-bottom: 10px; }
    .nav-btn { background: #21262d; border: 1px solid #30363d; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .nav-btn.active { background: #1f6feb; border-color: #58a6ff; }
    #gd-header { color: #fff; font-size: 13px; margin-bottom: 8px; display: flex; gap: 16px; font-weight: bold; text-transform: uppercase; }
    .hud-badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; color: #fff; background: #222; }
    canvas { background: #0d1117; border: 2px solid #30363d; border-radius: 6px; cursor: crosshair; }

    /* --- Menú de Niveles --- */
    #level-menu { display: none; width: 850px; height: 420px; background: #161b22; border: 2px solid #30363d; border-radius: 6px; padding: 20px; color: white; flex-direction: column; }
    .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .level-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .level-card { background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .btn-action { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px; }
    .btn-play { background: #2ea44f; color: white; }
    .btn-edit { background: #d97706; color: white; }
    .btn-delete { background: #dc2626; color: white; }

    /* --- Editor Toolbar --- */
